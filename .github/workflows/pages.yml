name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://ccc-backend.pongsinbas.workers.dev

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN (Cloudflare API token)"
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID (Cloudflare account ID = 0e00d9b1beeaf05140dd3777e0d2de90)"
          fi
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Add both secrets at https://github.com/M4rthin9/Dashboard/settings/secrets/actions"
            exit 1
          fi
          echo "Secrets OK"

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outcome == 'success'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ccc-dashboard
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
