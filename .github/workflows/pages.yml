name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Select target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "api_base=https://ccc-backend-dev.pongsinbas.workers.dev" >> "$GITHUB_OUTPUT"
            echo "label=development" >> "$GITHUB_OUTPUT"
            echo "Target: development -> dev.ccc-dashboard.pages.dev"
          else
            echo "api_base=https://ccc-backend.pongsinbas.workers.dev" >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
            echo "Target: production -> ccc-dashboard.pages.dev"
          fi

      - name: Build (${{ steps.target.outputs.label }})
        run: npm run build
        env:
          VITE_API_BASE: ${{ steps.target.outputs.api_base }}

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN (Cloudflare API token)"
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID (Cloudflare account ID = 0e00d9b1beeaf05140dd3777e0d2de90)"
          fi
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Add both secrets at https://github.com/M4rthin9/Dashboard/settings/secrets/actions"
            exit 1
          fi
          echo "Secrets OK"

      # cloudflare/pages-action@v1 is archived and always deploys to the
      # production branch. wrangler-action honours --branch, which is what
      # routes a `dev` push to the Preview environment and gives it the
      # stable alias dev.ccc-dashboard.pages.dev.
      - name: Deploy to Cloudflare Pages (${{ steps.target.outputs.label }})
        if: steps.secrets.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ccc-dashboard --branch=${{ github.ref_name }}
